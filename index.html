<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Donuts 321</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>Donuts dad and yes onaj fj did code this</h1>
    <nav>
      <a href="#shop">Shop</a>
      <a href="#cart">Cart</a>


    </nav>
  </header>

  <main>
    <section class="hero">
      <h2>Fresh. Sweet. Yours.</h2>
      <p>Handmade donuts delivered daily.</p>
    </section>

    <section id="shop">
      <h2>Our Donuts</h2>
      <div class="product-grid">
        <div class="product" data-name="Glazed" data-price="2">
          <img src="th.jfif" alt="Glazed Donut" />
          <h3>Glazed Donut</h3>
          <p>$2.00</p>
          <button>Add to Cart</button>
        </div>
        <div class="product" data-name="Chocolate" data-price="2.5">
          <img src="61b-UtxvSgL._AC_SX569_.jpg" alt="Chocolate Donut" />
          <h3>Chocolate Donut</h3>
          <p>$2.50</p>
          <button>Add to Cart</button>
        </div>
        <div class="product" data-name="Strawberry" data-price="2.25">
          <img src="OIP.jfif"Strawberry Donut" />
          <h3>Strawberry Donut</h3>
          <p>$2.25</p>
          <button>Add to Cart</button>
        </div>
      </div>
    </section>

    <section id="cart">
      <h2>Your Cart</h2>
      <ul id="cart-items"></ul>
      <p>Total: $<span id="total">0.00</span></p>
    </section>
  </main>

  <footer>
    <p>&copy; 2025 Donuts 321. All rights reserved.</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
